<section class="min-h-[calc(100vh-56px)] bg-slate-50 px-4 py-8 sm:px-6 lg:px-8">
	<div class="mx-auto max-w-7xl">
		<header class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
			<div>
				<p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-violet-700">Your network</p>
				<h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Contacts</h1>
				<p class="mt-2 text-sm text-slate-500">Keep the people you know close and easy to reach.</p>
			</div>
			<div class="inline-flex w-fit items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 shadow-sm">
				<span class="h-2 w-2 rounded-full bg-emerald-500"></span>
				<span><span class="font-semibold text-slate-900">{{ contacts.length }}</span> contacts</span>
			</div>
		</header>

		<app-data-grid class="block" [loading]="loading" [headers]="getHeaders()" [data]="contacts" [actions]="actions"></app-data-grid>
	</div>
</section>

@if (selectedContact) {
	<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-4" (click)="closeMessageModal()">
		<section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl sm:p-7" role="dialog" aria-modal="true" aria-labelledby="send-message-title" (click)="$event.stopPropagation()">
			<div class="mb-6 flex items-start justify-between gap-4">
				<div>
					<p class="text-sm font-medium text-violet-700">New message</p>
					<h2 id="send-message-title" class="mt-1 text-xl font-semibold text-slate-900">Send a message</h2>
					<p class="mt-2 text-sm text-slate-500">To {{ selectedContact.name }}</p>
				</div>
				<button class="rounded-md p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-violet-500 disabled:opacity-50" type="button" aria-label="Close dialog" [disabled]="isSendingMessage" (click)="closeMessageModal()">
					<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m6 6 12 12M18 6 6 18" /></svg>
				</button>
			</div>

			<form class="space-y-4" (submit)="$event.preventDefault(); submitMessage()">
				<div>
					<label class="mb-2 block text-sm font-medium text-slate-700" for="message-type">Message type</label>
					<select id="message-type" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-200" [value]="messageType" (change)="messageType = $any($event.target).value">
						<option value="text">Text</option>
						<option value="email">Email</option>
					</select>
				</div>

				<div>
					<label class="mb-2 block text-sm font-medium text-slate-700" for="message-body">Message</label>
					<textarea id="message-body" class="min-h-32 w-full resize-y rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-violet-500 focus:ring-2 focus:ring-violet-200" maxlength="2000" placeholder="Write your message…" [value]="messageBody" (input)="messageBody = $any($event.target).value"></textarea>
				</div>

				@if (messageFeedback) {
					<p class="rounded-lg px-3 py-2 text-sm" [class.bg-rose-50]="messageHasError" [class.text-rose-700]="messageHasError" [class.bg-emerald-50]="!messageHasError" [class.text-emerald-700]="!messageHasError" role="status">{{ messageFeedback }}</p>
				}

				<div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-4 sm:flex-row sm:justify-end">
					<button class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 disabled:opacity-50" type="button" [disabled]="isSendingMessage" (click)="closeMessageModal()">Cancel</button>
					<button class="inline-flex items-center justify-center gap-2 rounded-lg bg-violet-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" type="submit" [disabled]="!messageBody.trim() || isSendingMessage">
						@if (isSendingMessage) {
							<span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
							Sending…
						} @else {
							Send message
						}
					</button>
				</div>
			</form>
		</section>
	</div>
}
