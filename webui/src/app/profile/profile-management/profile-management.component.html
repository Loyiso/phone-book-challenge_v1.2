<main class="mx-auto flex min-h-screen w-full max-w-2xl flex-col gap-8 bg-slate-50 px-4 py-8 sm:px-6">
<form class="flex w-full flex-col gap-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm" [formGroup]="updateMyProfileForm" (ngSubmit)="updateProfile()">
    <h2 class="text-xl font-semibold text-slate-900">Update My Profile</h2>
    @if (isLoadingProfile) {
        <p class="text-sm text-slate-600" role="status">Loading your profile…</p>
    }
    @if (profileError) {
        <p class="text-sm text-red-700" role="alert">{{ profileError }}</p>
    }
    @if (profileSuccess) {
        <p class="text-sm text-green-700" role="status">{{ profileSuccess }}</p>
    }
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="name">
        Name:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="text" id="name" name="name" formControlName="name" required>
    </label>
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="surname">
        Surname:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="text" id="surname" name="surname" formControlName="surname" required>
    </label>
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="email">
        Email:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="email" id="email" name="email" formControlName="email" required>
    </label>
    <button class="w-full rounded-md bg-violet-700 px-4 py-3 font-semibold text-white transition-colors hover:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:w-fit" type="submit" [disabled]="isLoadingProfile || isSavingProfile">
        {{ isSavingProfile ? 'Saving…' : 'Update Profile' }}
    </button>
</form>

<form class="flex w-full flex-col gap-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm" [formGroup]="updatePasswordForm" (ngSubmit)="updatePassword()">
    <h2 class="text-xl font-semibold text-slate-900">Update Password</h2>
    @if (passwordError) {
        <p class="text-sm text-red-700" role="alert">{{ passwordError }}</p>
    }
    @if (passwordSuccess) {
        <p class="text-sm text-green-700" role="status">{{ passwordSuccess }}</p>
    }
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="currentPassword">
        Current Password:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="password" id="currentPassword" name="currentPassword" formControlName="currentPassword" required>
    </label>
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="newPassword">
        New Password:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="password" id="newPassword" name="newPassword" formControlName="newPassword" required>
    </label>
    <label class="flex flex-col gap-2 text-sm font-medium text-slate-700" for="confirmPassword">
        Confirm Password:
        <input class="w-full rounded-md border border-slate-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="password" id="confirmPassword" name="confirmPassword" formControlName="confirmPassword" required>
    </label>
    <button class="w-full rounded-md bg-violet-700 px-4 py-3 font-semibold text-white transition-colors hover:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 sm:w-fit" type="submit" [disabled]="isSavingPassword">
        {{ isSavingPassword ? 'Saving…' : 'Update Password' }}
    </button>
</form>
</main>
