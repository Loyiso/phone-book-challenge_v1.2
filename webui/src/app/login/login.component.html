@if (isAuthenticating) {
  <div>Authenticating...</div>
}
@else {
  <form class="mx-auto flex min-h-screen w-full max-w-sm flex-col justify-center gap-4 box-border px-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="flex flex-col gap-2 text-sm font-medium text-gray-700">
        Email:
        <input class="w-full rounded-md border border-gray-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="email" formControlName="email">
      </label>
    <label class="flex flex-col gap-2 text-sm font-medium text-gray-700">
      Password:
      <input class="w-full rounded-md border border-gray-300 px-3 py-2 text-base outline-none focus:border-violet-600 focus:ring-2 focus:ring-violet-200" type="password" formControlName="password">
    </label>
    <button class="w-full rounded-md bg-violet-700 px-4 py-3 font-semibold text-white transition-colors hover:bg-violet-800 disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="isAuthenticating">Login</button>
  </form>
}
